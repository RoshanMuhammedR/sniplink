# Production stack for the shared VPS. Postgres/Redis are NOT defined here - both apps
# (url_short, kb) share one Postgres and one Redis instance, brought up separately from
# /opt/stack/data/docker-compose.yml. The global Caddy proxy (also a separate stack, in
# /opt/stack/proxy/) routes to `api`/`ui` by Docker DNS name over the `edge` network - neither
# service here publishes a host port.
name: url-short

services:

  api:
    image: ghcr.io/${GHCR_OWNER}/sniplink-api:${IMAGE_TAG}
    container_name: url-short-api
    restart: on-failure:5
    labels:
      sablier.enable: "true"
      sablier.group: "url-short"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      APP_CACHE_URL_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=65.0}
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.0
    networks: [edge, data]
    # Not published: reachable only via the global proxy on `edge`.

  ui:
    image: ghcr.io/${GHCR_OWNER}/sniplink-ui:${IMAGE_TAG}
    container_name: url-short-ui
    restart: on-failure:5
    depends_on: [api]
    labels:
      sablier.enable: "true"
      sablier.group: "url-short"
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    networks: [edge]

networks:
  edge:
    external: true
  data:
    external: true
