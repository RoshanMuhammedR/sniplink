name: sniplink

# The VPS is NAT'd and cannot bind 80/443 — AIC Cloud's shared proxy terminates
# TLS for the domain and forwards to APP_PORT on this host. So there is no edge
# proxy in this stack: `ui` is the router (see sniplink-ui/nginx.conf) and the
# only service that publishes a port.

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ from compose so the container's shell expands it.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  api:
    image: ghcr.io/${GHCR_OWNER}/sniplink-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Spring's relaxed binding maps these onto application.yml, so there is no
      # production config file to keep in sync.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_BASE_URL}
      APP_RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      APP_CACHE_URL_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70.0}
    # Without a limit, MaxRAMPercentage sizes the heap against the host's whole
    # 4 GB and the JVM would crowd out Postgres. 70% of 1 GB is a ~716 MB heap,
    # which is ample for this workload.
    mem_limit: 1g
    networks: [internal]
    # Not published: only reachable through `ui`.

  ui:
    image: ghcr.io/${GHCR_OWNER}/sniplink-ui:${IMAGE_TAG}
    restart: unless-stopped
    depends_on: [api]
    ports:
      # Bound to all interfaces because AIC's proxy reaches us over the private
      # network (10.10.10.x), not loopback. The VPS has no public IPv4 of its
      # own, so this is not directly exposed to the internet.
      - "${APP_PORT:-3000}:80"
    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
