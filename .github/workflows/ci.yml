name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  api:
    name: API — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sniplink-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The suite is pure Base62 unit tests that never boot a Spring context,
      # so no Postgres or Redis service container is needed here.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  ui:
    name: UI — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sniplink-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sniplink-ui/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Also type-checks: the build script is `tsc -b && vite build`.
      - run: npm run build
