name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-url-short
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - id: tag
        run: |
          echo "tag=sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'api' && './sniplink-api' || './sniplink-ui' }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/sniplink-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/sniplink-${{ matrix.service }}:latest

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Render .env and rsync deploy/ to the VPS
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          sshpass -e rsync -az --delete -e "ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.env' \
            deploy/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stack/url-short/

          cat > /tmp/url-short.env <<EOF
          GHCR_OWNER=${{ needs.prepare.outputs.owner }}
          IMAGE_TAG=${{ needs.prepare.outputs.tag }}
          POSTGRES_DB=url_short
          POSTGRES_USER=url_short
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          CORS_ALLOWED_ORIGINS=http://37.187.140.45:8081,http://sniplink.dedyn.io,https://sniplink.dedyn.io
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          RATE_LIMIT_PER_MINUTE=30
          CACHE_TTL_HOURS=24
          JAVA_OPTS=-XX:MaxRAMPercentage=65.0
          EOF

          sshpass -e scp -P ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no \
            /tmp/url-short.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stack/url-short/.env
          rm -f /tmp/url-short.env

      - name: Run the shared deploy script on the VPS
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "bash /opt/stack/scripts/deploy.sh url-short ${{ needs.prepare.outputs.tag }} ${{ github.sha }}"
