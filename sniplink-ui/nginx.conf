# Static file serving only. This container proxies nothing — Caddy sits in
# front and routes /api/*, /swagger-ui*, and root-level short codes straight to
# the API, sending everything else here.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Caddy already compresses on the way out; doing it twice wastes CPU.
	gzip off;

	access_log /var/log/nginx/access.log;

	# Vite content-hashes everything under /assets, so a given URL's bytes never
	# change and the response can be cached indefinitely.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# The entry point must never be cached, or a deploy leaves browsers pointing
	# at asset filenames that no longer exist.
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

	# Single-page app: unknown paths fall back to the shell rather than 404ing.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
