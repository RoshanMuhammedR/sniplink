# This container is the app's router, not just a static file server.
#
# The VPS is NAT'd and cannot bind 80/443, so AIC Cloud's shared proxy
# terminates TLS for sniplink.dedyn.io and forwards to the VPS on port 3000,
# which compose maps to this container. Everything therefore arrives here as
# plain HTTP, and this file decides what is the SPA and what is the API.

# AIC's proxy is the only thing that can reach this container, so trust it to
# report the caller and recover the real client from X-Forwarded-For.
#
# real_ip_recursive walks XFF from the right, skipping trusted addresses, so a
# client that sends its own X-Forwarded-For cannot win: the right-most entry is
# the peer AIC actually saw. That matters because ClientIpResolver reads the
# LEFT-most entry — without this, a caller could rotate the header and slip the
# per-IP rate limit.
set_real_ip_from 10.10.10.0/24;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream api {
	server api:8080;
}

# Applied to every proxied location below.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite rather than append ($proxy_add_x_forwarded_for) — see above.
proxy_set_header X-Forwarded-For $remote_addr;
# AIC terminates TLS, so the original scheme is always https by the time it
# reaches us. Spring's forward-headers-strategy uses this to build absolute URLs.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# AIC's edge already compresses; doing it twice just burns CPU.
	gzip off;

	# --- API ---------------------------------------------------------------
	location /api/ {
		proxy_pass http://api;
	}

	location /swagger-ui {
		proxy_pass http://api;
	}

	location /v3/api-docs {
		proxy_pass http://api;
	}

	location /webjars/ {
		proxy_pass http://api;
	}

	# Short links at the web root. Quoted because nginx would otherwise read the
	# {1,10} braces as block syntax. The Base62 alphabet has no dots or slashes,
	# so /assets/index-abc.js and /favicon.svg can never match, and bare / needs
	# at least one character so it still reaches the SPA.
	location ~ "^/[0-9a-zA-Z]{1,10}$" {
		proxy_pass http://api;
	}

	# --- static ------------------------------------------------------------
	# Vite content-hashes these, so the bytes behind a URL never change.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Never cache the entry point, or a deploy leaves browsers asking for asset
	# filenames that no longer exist.
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	# /actuator/** is intentionally absent: health stays reachable only on the
	# internal docker network.
}
